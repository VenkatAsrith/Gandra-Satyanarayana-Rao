name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. CLIENT BUILD & BUNDLE VERIFICATION
  # --------------------------------------------------------------------------
  client-build:
    name: Client Build & Bundle Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          npm --prefix client ci || npm --prefix client install

      - name: Build Production Bundle (Vite)
        run: |
          npm --prefix client run build
        env:
          NODE_ENV: production
          VITE_API_URL: /api/v1

      - name: Verify Distribution Artifacts
        run: |
          test -d client/dist
          test -f client/dist/index.html
          echo "Client production bundle verified successfully."

      - name: Archive Client Build Artifact (Node 22.x only)
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: client-production-dist
          path: client/dist/
          retention-days: 7

  # --------------------------------------------------------------------------
  # 2. SERVER TESTS & DATABASE INTEGRATION
  # --------------------------------------------------------------------------
  server-test:
    name: Server API & Integration Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: |
          npm --prefix server ci || npm --prefix server install

      - name: Seed Test MongoDB Database
        run: |
          npm --prefix server run seed
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/sathenna_profile_test
          JWT_SECRET: ci_test_super_secret_jwt_key_64_characters_long_for_security_testing
          COOKIE_SECRET: ci_test_super_secret_cookie_key_64_characters_long_testing

      - name: Run Jest API Test Suite (20 Tests)
        run: |
          npm --prefix server test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/sathenna_profile_test
          JWT_SECRET: ci_test_super_secret_jwt_key_64_characters_long_for_security_testing
          COOKIE_SECRET: ci_test_super_secret_cookie_key_64_characters_long_testing
          PORT: 5001

  # --------------------------------------------------------------------------
  # 3. MONOREPO INTEGRITY CHECK
  # --------------------------------------------------------------------------
  monorepo-check:
    name: Monorepo Integrity & Health Check
    needs: [client-build, server-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Validate Root Monorepo Structure
        run: |
          test -f package.json
          test -d client/src
          test -d server/src
          echo "Monorepo structure is complete and intact."

      - name: Run Root Build & Test Scripts
        run: |
          npm --prefix client install
          npm run build:client
          npm run test:client
          echo "All monorepo pre-flight checks passed."
